name: Trigger Render Backend Deployment

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
  workflow_dispatch:

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Webhook
        env:
          # You must add RENDER_DEPLOY_HOOK_URL as a Secret in your GitHub Repo settings
          # You can get this URL from your Web Service settings in the Render dashboard
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set!"
            echo "Please create a Render.com account, create a New Web Service connected to this Repo,"
            echo "copy the 'Deploy Hook' URL, and add it to GitHub Settings -> Secrets -> Actions"
            exit 1
          fi
          echo "Triggering deployment..."
          curl -X POST "$RENDER_HOOK"
